name: scan-and-patch-image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.actor }}/vuln-nginx:latest

jobs:
  patch:
    runs-on: ubuntu-latest
    environment: GITHUB_TOKEN
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Scan current image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-report.json
          vuln-type: os
          ignore-unfixed: true      # only report vulns that have a fix
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Any fixable vulns?
        id: check
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_number }}
          path: trivy-report.json
          retention-days: 90

      # Use custom docker socket for buildkit
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Get socket path
        run: |
            url=$(docker context inspect | jq -r .[0].Endpoints.docker.Host)
            socket_path=$(echo "$url" | awk -F// '{print $2}')
            echo "$socket_path"
            echo "SOCKET=$socket_path" >> $GITHUB_ENV

      - name: Patch with Copa
        if: steps.check.outputs.count != '0'
        id: copa
        uses: project-copacetic/copa-action@v1.2.1
        with:
          image: ${{ env.IMAGE }}
          image-report: trivy-report.json
          patched-tag: patched
          custom-socket: ${{ env.SOCKET }}
      
      - name: Log in and push patched image
        if: steps.check.outputs.count != '0'
        env:
          PATCHED_IMAGE: ${{ steps.copa.outputs.patched-image }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

          docker push "$PATCHED_IMAGE"

      - name: Resolve pushed image digest
        id: image
        if: steps.check.outputs.count != '0'
        env:
          PATCHED_IMAGE: ${{ steps.copa.outputs.patched-image }}
        run: |
          digest="$(docker buildx imagetools inspect "$PATCHED_IMAGE" \
            --format '{{.Manifest.Digest}}')"

          if [[ -z "$digest" || "$digest" != sha256:* ]]; then
            echo "Could not resolve an immutable image digest"
            exit 1
          fi

          image_name="${PATCHED_IMAGE%%:*}"

          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Re-scan patched image (gate)
        if: steps.check.outputs.count != '0'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.copa.outputs.patched-image }}
          vuln-type: os
          format: 'spdx-json'
          output: trivy-patched-report.json
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
      
      - name: Upload Patched Trivy report
        if: steps.check.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-patched-${{ github.run_number }}
          path: trivy-patched-report.json
          retention-days: 90

      - name: Log in and push patched image
        if: steps.check.outputs.count != '0'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ steps.copa.outputs.patched-image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
 
      - name: Sign the patched image (keyless)
        run: |
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: "1"   # enables keyless signing via Fulcio/Rekor
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}

      - name: Generate SLSA build provenance
        if: steps.check.outputs.count != '0'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attach vulnerability scan as attestation
        uses: actions/attest-sbom@v1   # or a custom predicate via cosign attest
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: trivy-patched-report.json   # adjust to wherever your re-scan writes output
          push-to-registry: true
 
      - name: Verify signature (sanity check in CI)
        if: steps.check.outputs.count != '0'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign verify "${{ steps.image.outputs.patched-image }}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
